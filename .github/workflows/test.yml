name: Test
on:
  push:
  pull_request:

permissions: read-all

jobs:
  build:
    name: Perform tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install & Test
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

      - name: Run ESLint
        run: |
          pnpm run lint

      - name: Run bench tests
        run: |
          pnpm run bench

      - name: Run Prettier
        run: |
          pnpm run format:check

      - name: Code Coverage
        uses: codecov/codecov-action@v7
