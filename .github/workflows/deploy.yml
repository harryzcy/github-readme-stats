name: Deploy

on:
  push:
    branches:
      - cloudflare
  workflow_dispatch:
    inputs:
      username:
        description: "GitHub username the smoke test renders cards for"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build packages
        run: pnpm run build:packages

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/cloudflare
          packageManager: pnpm

  verify:
    name: Verify deployment
    needs: deploy
    # A skipped deploy would otherwise skip this too, and manual runs skip it.
    if: ${{ !cancelled() && needs.deploy.result != 'failure' }}
    uses: ./.github/workflows/verify.yml
    with:
      base-url: https://github-readme-stats.zcy.dev
      username: ${{ inputs.username }}
