name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare
      - master
  pull_request:
    branches:
      - cloudflare
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # The job names below are required status checks on the cloudflare ruleset.
  # Renaming one leaves every pull request waiting on a check that never runs.
  build-and-test:
    name: Build and test ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # 24 matches .nvmrc and upstream; 26 is what we develop on
        node: [24, 26]
        # Pinned rather than ubuntu-latest, which still resolves to 24.04.
        # Upstream covers macos instead; this fork ships to workerd only.
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ matrix.node }}

      - name: Build packages
        run: pnpm run build:packages

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Run tests
        run: pnpm run test

  code-checks:
    name: Code checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier
        run: pnpm run format:check

      - name: Lint (knip)
        run: pnpm run lint:knip

      - name: Lint (deduped deps)
        run: pnpm run lint:deps

      # packages/core and apps/frontend typecheck upstream's vendored sources,
      # which do not hold against the dependency versions this fork runs ahead
      # on. Drop the filter once those line up; upstream runs the whole task.
      - name: Typecheck
        run: |
          pnpm exec turbo run typecheck --filter=./apps/cloudflare --filter=./apps/backend
          pnpm exec tsc -p tsconfig.scripts.json
