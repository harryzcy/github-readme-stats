name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare
      - master
  pull_request:
    branches:
      - cloudflare
      - master

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-and-test:
    name: Build and test ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # 24 matches .nvmrc and upstream; 26 is what we develop on
        node: [24, 26]
        # Pinned; ubuntu-latest is still 24.04. Upstream covers macos instead.
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ matrix.node }}

      - name: Build packages
        run: pnpm run build:packages

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Run tests
        run: pnpm run test

  code-checks:
    name: Code checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier
        run: pnpm run format:check

      - name: Lint (knip)
        run: pnpm run lint:knip

      - name: Lint (deduped deps)
        run: pnpm run lint:deps

      # core and frontend check vendored sources against dependency versions
      # this fork runs ahead on. Drop the filter once those line up.
      - name: Typecheck
        run: |
          pnpm exec turbo run typecheck --filter=./apps/cloudflare --filter=./apps/backend
          pnpm exec tsc -p tsconfig.scripts.json

      # Wrangler resolves core through its build output.
      - name: Build packages
        run: pnpm run build:packages

      # Nothing else in CI bundles the worker; without this a build failure
      # would only surface once the preview deployment ran.
      - name: Bundle the worker
        run: pnpm --filter ./apps/cloudflare exec wrangler deploy --dry-run
