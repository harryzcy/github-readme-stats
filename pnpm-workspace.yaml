packages:
  - apps/*
  - packages/*

catalog:
  "@vitest/coverage-v8": 5.0.0
  axios: ^1.21.1
  jsdom: 31.0.1
  nock: 15.0.6
  vitest: 5.0.0

# Deliberately stricter than pnpm's 1440 default (7 days vs 1)
minimumReleaseAge: 10080

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers, instead of warning. Upstream also sets `engineStrict`,
# which we cannot: the vendored packages pin node 24.x and we develop on 26.
strictPeerDependencies: true
allowBuilds:
  unrs-resolver: true
  # Not in upstream's list: only the Cloudflare app pulls these in, via wrangler.
  esbuild: true
  workerd: true
